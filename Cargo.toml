[workspace]
resolver = "2"
members = ["crates/vaultsnap-core", "crates/vaultsnap-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3.10"
thiserror = "2"
tokio = "1.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vaultsnap-core = { path = "crates/vaultsnap-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
overflow-checks = true
