[workspace]
resolver = "2"
members = ["crates/vaultsnap-core", "crates/vaultsnap-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
argon2 = "0.5"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-types = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.2"
globset = { version = "0.4", default-features = false }
hkdf = "0.12"
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2"
tokio = "1.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vaultsnap-core = { path = "crates/vaultsnap-core" }
zeroize = "1"
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Argon2id is deliberately slow; unoptimized dependencies would make debug builds and tests crawl.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
overflow-checks = true
