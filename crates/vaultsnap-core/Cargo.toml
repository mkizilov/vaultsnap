[package]
name = "vaultsnap-core"
description = "Backup logic and repository operations for VaultSnap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["s3"]
# The S3 client (AWS SDK for Rust). Without it the S3 backend's logic and its in-memory test
# double still build and are tested; `S3Backend::connect` then reports that this build has no S3.
s3 = [
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-types",
    "tokio/rt-multi-thread",
    "tokio/time",
]

[dependencies]
argon2.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
blake3.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
globset.workspace = true
hkdf.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
zeroize.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "chunking"
harness = false

# End-to-end throughput and deduplication on real directories (docs/RELIABILITY.md).
[[bench]]
name = "throughput"
harness = false

# Needs a MinIO server (see docs/S3.md); the tests skip themselves when none is configured.
[[test]]
name = "s3_minio"
required-features = ["s3"]

[lints]
workspace = true
